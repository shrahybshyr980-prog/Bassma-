.la .hd{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:6px}.g2{display:flex;justify-content:space-between;gap:12px;font-size:12px}.g2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;text-align:center}.bxr{border:2px solid #000;border-radius:12px;padding:8px}.la table{border:2px solid #000;border-radius:12px;overflow:hidden}.la td,.la th{background:#fff;color:#000;border:0;border-inline-start:1px solid #000}.la th{border-bottom:2px solid #000}.la .tt{width:auto;margin:0;border:2px solid #000;border-radius:12px}.sg{margin-top:30px}.ft{margin-top:24px;font-size:12px;text-align:center;border-top:1px solid #000;padding-top:6px}

@media(min-width:99999px){body{font-size:18px}.sb{width:290px}.sb button{font-size:18px;padding:14px}main{max-width:1700px;padding:24px 40px 60px}header{padding:20px 40px}.tg{grid-template-columns:repeat(6,1fr)}.gr{grid-template-columns:repeat(6,1fr)}#pls{grid-template-columns:1fr 1fr 1fr}.sg{grid-template-columns:minmax(460px,1fr) 1.6fr}.mb:has(.iv){max-width:960px}}

</style></head><body><div id=app></div><div id=m></div>
<script>
let U=null,D=null,T='sell',cart=[],MO=0;const LOW=10;
const $=s=>document.querySelector(s),f=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),
e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),u=m=>m=='kg'?'كغ':'قطعة',
sum=(a,fn)=>a.reduce((x,y)=>x+fn(y),0),
save=()=>{try{localStorage.setItem('shop_'+U,JSON.stringify(D))}catch(x){}},
bal=id=>sum(D.s.filter(s=>s.cid==id),s=>s.total-s.paid)-sum(D.y.filter(y=>y.cid==id),y=>y.amt),
prof=S=>sum(S,s=>sum(s.items,i=>(i.price-i.buy)*i.qty)),
stockV=()=>sum(D.p,p=>p.qty*p.buy);
function seed(){const D={p:[],c:[],s:[],f:[],y:[],n:1,id:1,pur:0},t=today(),yd=new Date(Date.now()-864e5).toISOString().slice(0,10);
[['حديد 6','cube',300,400,100],['حديد 8','cube',450,580,80],['حديد 10','cube',700,880,60],['بانتورة','kg',200,300,250],['إسمنت','cube',900,1050,40],['سلك ربط','kg',180,250,120],['مسامير','kg',220,300,8]].forEach(a=>{D.p.push({id:D.id++,name:a[0],m:a[1],buy:a[2],sell:a[3],qty:a[4],code:'',sup:['مصنع الحديد','مصنع الحديد','مصنع الحديد','مورد الرمل','مصنع الإسمنت','مورد الحديد','مورد الحديد'][D.p.length],date:t});D.pur+=a[2]*a[4]});
['أحمد بن علي','كريم مرابط','يوسف حداد'].forEach((n,i)=>D.c.push({id:D.id++,name:n,phone:'0555 00 00 0'+i,addr:'',note:''}));
const sale=(cid,date,L,paid)=>{const items=L.map(([k,q])=>{const p=D.p[k];p.qty-=q;return{pid:p.id,name:p.name,m:p.m,qty:q,price:p.sell,buy:p.buy}});const total=sum(items,i=>i.qty*i.price);D.s.push({id:D.id++,no:'F-'+D.n++,date,cid,items,total,paid:paid??total})};
sale(D.c[0].id,yd,[[0,20],[4,5]],10000);sale(D.c[1].id,yd,[[3,12.5]]);sale(0,t,[[1,10],[5,8.5]]);sale(D.c[2].id,t,[[2,15]],8000);
D.y.push({id:D.id++,cid:D.c[0].id,amt:2000,date:t});D.f.push({id:D.id++,no:'P-'+D.n++,date:t,cid:D.c[1].id,items:[{pid:D.p[0].id,name:D.p[0].name,m:'cube',qty:30,price:400,buy:300}],total:12000});return D}
function login(n){U=n;T='sell';MO=0;try{D=JSON.parse(localStorage.getItem('shop_'+n))}catch(x){D=null}D=D||seed();save();render()}
const TABS=[['dash','الرئيسية'],['sell','البيع'],['prod','السلع'],['cust','الزبائن'],['debt','الديون'],['inv','الفواتير'],['rep','التقارير'],['sup','الموردين'],['shop','معلومات المحل']];
const IC={dash:'📊',sell:'🛒',prod:'📦',cust:'👥',debt:'💰',inv:'🧾',rep:'📈',sup:'🚚',shop:'⚙️'};
function render(){document.documentElement.dataset.u=U?(U=='فار الأزهر'?'f':'h'):'';
if(!U){$('#app').innerHTML=`<div class=lg><div style="font-size:52px">🏪</div><h1>تسيير المحل</h1><p class=mu>اختر الحساب</p><button onclick="login('فار الأزهر')">فار الأزهر</button><button class=u2 onclick="login('حميم عبد الرزاق')">حميم عبد الرزاق</button></div>`;return}
$('#app').innerHTML=`<aside class=sb><div class=br>🏪 ${e((D.shop||{}).name||'محل '+U)}</div>${TABS.map(t=>`<button class="${t[0]==T?'on':''}" onclick="T='${t[0]}';MO=0;render()"><span>${IC[t[0]]}</span>${t[1]}</button>`).join('')}<div class=sbf><button onclick="U=null;cart=[];render()"><span>🚪</span>خروج</button></div></aside><div class=ct><header><span class=pt>${T=='sell'?e((D.shop||{}).name||'محل '+U):(TABS.find(t=>t[0]==T)||[])[1]}</span><span class=us><span class=mu>👤 ${U}</span> <button class=g onclick="U=null;cart=[];render()">خروج</button></span></header><nav><button class=on onclick="MO=!MO;render()">☰ ${T=='sell'?'':TABS.find(t=>t[0]==T)[1]}</button>${MO?`<div class=mn>${TABS.map(t=>`<button class="${t[0]==T?'on':''}" onclick="T='${t[0]}';MO=0;render()">${t[1]}</button>`).join('')}</div>`:''}</nav><main>${V[T]()}</main></div>`;
if(T=='sell'){drawCart();drawS()}if(T=='prod')drawP();if(T=='inv')drawI();fit()}
function fit(){const W=innerWidth,H=innerHeight,r=document.documentElement,a=$('#app'),m=$('#m');if(!a)return;if(W<900){r.style.setProperty('--z',1);r.removeAttribute('data-fz');a.style.zoom=m.style.zoom='';return}const z=Math.max(.75,Math.min(1.6,Math.min(W/1366,H/700))),ew=W/z;r.style.setProperty('--z',z);r.dataset.fz=ew<1150?'s':ew>1650?'l':'n';a.style.zoom=m.style.zoom=z}
addEventListener('resize',fit);fit();
const V={
sup(){VL=supNames();return `<div class=card><h3>تسجيل مورد</h3><input id=vn placeholder="اسم المورد"><input id=vt placeholder="الهاتف"><input id=va placeholder="العنوان"><input id=vr placeholder="رقم السجل التجاري"><input id=vf placeholder="الرقم الجبائي NIF"><input id=vs placeholder="رقم التعريف الإحصائي NIS"><input id=vb placeholder="الحساب البنكي / CCP"><input id=vm placeholder="ملاحظات"><button onclick=addV()>حفظ المورد</button></div><h3>قائمة الموردين (${VL.length})</h3>${VL.map((n,i)=>{const v=(D.v||[]).find(x=>x.name==n)||{},R=vrows(n),T=sum(R,r=>r.t),P=sum(R,r=>r.p);return `<div class=card><b>${e(n)}</b> <small>${e([v.phone,v.addr,v.rc?'RC '+v.rc:'',v.nif?'NIF '+v.nif:''].filter(Boolean).join(' · '))}</small><br>إجمالي التوريد: ${f(T)} دج · المدفوع: ${f(P)} دج<br><b>المتبقي له (الرصيد): ${f(T-P)} دج</b><br>${T-P>0.001?`<button onclick=vpay(${i})>تسجيل تسديد</button>`:''}<button class=g onclick=vst(${i})>كشف الحساب</button><button class=g onclick=vedit(${i})>تعديل</button></div>`}).join('')||'<p class=mu>لا يوجد موردون بعد</p>'}`},
supOld(){const M={};D.p.forEach(p=>{(p.h&&p.h.length?p.h:[{date:p.date,qty:p.qty,buy:p.buy,sup:p.sup,supi:p.supi}]).forEach(h=>{if(!h.sup)return;const m=M[h.sup]=M[h.sup]||{n:h.sup,i:'',it:new Set(),t:0,d:''};if(h.supi)m.i=h.supi;m.it.add(p.name);m.t+=(h.qty||0)*h.buy;if((h.date||'')>m.d)m.d=h.date||''})});const L=Object.values(M).sort((a,b)=>b.d.localeCompare(a.d));return `<h3>قائمة الموردين (${L.length})</h3>${L.map(m=>`<div class=card><b>${e(m.n)}</b>${m.i?' · '+e(m.i):''}<br>السلع: ${[...m.it].map(x=>e(x)).join('، ')}<br>إجمالي المشتريات: <b>${f(m.t)} دج</b><br><small>آخر توريد: ${m.d}</small></div>`).join('')||'<p class=mu>لا يوجد موردون بعد. اكتب اسم المورد عند إضافة سلعة أو إدخال كمية.</p>'}`},
shop(){const s=D.shop||{},h=H();return `<div class=card><h3>معلومات المحل</h3><p class=mu>اكتب معلومات محلك، وعلّم على الخانات اللي تحب تخرج في الفاتورة.</p><input id=f_name placeholder="اسم المحل" value="${e(s.name||'')}"><input id=f_tva type=number step=any placeholder="نسبة TVA % (اتركها فارغة = بدون TVA)" value="${s.tva||''}">${SF.map(([k,l])=>`<div class=fr><input id=f_${k} placeholder="${l}" value="${e(s[k]||'')}"><label><input type=checkbox id=c_${k} ${h[k]?'checked':''}> تظهر</label></div>`).join('')}<button onclick=saveShop()>حفظ</button></div><div class=card><b>معاينة رأس الفاتورة</b><div style="margin-top:8px">${shopH()}</div></div>`},
dash(){const t=today(),S=D.s,low=D.p.filter(p=>p.qty<=LOW),mo=S.filter(s=>s.date.slice(0,7)==t.slice(0,7));

function drawIold(){const q=($('#iq').value||'').trim(),nm=d=>(D.c.find(c=>c.id==d.cid)||{name:'زبون عابر'}).name,ok=d=>!q||d.no.toLowerCase().includes(q.toLowerCase())||nm(d).includes(q);
$('#il').innerHTML=[...D.f.filter(ok).map(d=>({d,t:'f'})),...D.s.filter(ok).map(d=>({d,t:'s'}))].sort((a,b)=>b.d.id-a.d.id).map(({d,t})=>`<div class=r><div>${d.no} · ${e(nm(d))}<br><small>${d.date} · ${f(d.total)} دج${t=='f'?' · شكلية':''}</small></div><div><button class=g onclick="show('${t}',${d.id})">عرض</button><button class=g onclick="printD('${t}',${d.id})">طباعة</button>${t=='f'?`<button onclick=convert(${d.id})>تأكيد البيع</button>`:''}<button class=d onclick="delD('${t}',${d.id})">حذف</button></div></div>`).join('')||'<p class=mu>لا توجد فواتير</p>'}
function delD(t,id){if(!confirm('حذف هذه الفاتورة نهائياً؟'))return;if(t=='b'){D.b=(D.b||[]).filter(x=>x.id!=id)}else if(t=='f'){D.f=D.f.filter(x=>x.id!=id)}else{const s=D.s.find(x=>x.id==id);if(confirm('إرجاع الكميات إلى المخزون؟')){s.items.forEach(i=>{const p=D.p.find(x=>x.id==i.pid);if(p)p.qty=Math.round((p.qty+i.qty)*1000)/1000})}D.s=D.s.filter(x=>x.id!=id)}save();drawI()}
function printD(t,id){show(t,id);setTimeout(()=>window.print(),300)}
function show(t,id){const d=(t=='f'?D.f:t=='b'?D.b||[]:D.s).find(x=>x.id==id);modal(invH(d))}
function toBL(id){const s=D.s.find(x=>x.id==id),d={id:D.id++,no:nx('BL'),date:today(),cid:s.cid,items:s.items};(D.b=D.b||[]).push(d);save();IT='b';T='inv';render();modal(invH(d))}
function bl(){if(!cart.length)return alert('الفاتورة فارغة');const d={id:D.id++,no:nx('BL'),date:today(),cid:getCid(),items:cart};(D.b=D.b||[]).push(d);save();cart=[];IT='b';modal(invH(d));render()}
function showOld(t,id){const d=(t=='f'?D.f:D.s).find(x=>x.id==id);modal(invH(d,t=='f'?'فاتورة شكلية / Proforma':'فاتورة'))}
function addP(){const n=$('#pn').value.trim(),b=+$('#pb').value,s=+$('#ps').value,q=+$('#pq').value||0;if(!n||!(s>0))return alert('أدخل الاسم وسعر البيع');
D.p.push({id:D.id++,name:n,m:$('#pm').value,buy:b,sell:s,qty:q,code:$('#pc').value,sup:$('#pv').value.trim(),supi:$('#pvi').value.trim(),h:[{date:today(),qty:q,buy:b,sell:s,sup:$('#pv').value.trim(),supi:$('#pvi').value.trim(),total:b*q,paid:$('#pp').value===''?b*q:Math.min(+$('#pp').value,b*q)}],date:today()});D.pur+=b*q;regV($('#pv').value.trim(),$('#pvi').value.trim());save();render()}
function drawP(){const q=($('#q').value||'').trim();$('#pls').innerHTML=D.p.filter(p=>!q||p.name.includes(q)||(p.code||'').includes(q)).map(p=>`<div class=card><b>${e(p.name)}</b> <small>${p.code?'#'+e(p.code):''}</small><br>${u(p.m)} · شراء ${f(p.buy)} · بيع ${f(p.sell)}${p.sup?'<br>المورد: '+e(p.sup)+(p.supi?' · '+e(p.supi):''):''}${p.h&&p.h.length?'<br><small>آخر تحديث: '+p.h[p.h.length-1].date+'</small>':''}<br>المخزون: <b>${f(p.qty)} ${u(p.m)}</b><br><button onclick=stk(${p.id})>إدخال كمية</button><button class=g onclick="prc(${p.id},'buy')">تعديل سعر الشراء</button><button class=g onclick="prc(${p.id},'sell')">تعديل سعر البيع</button><button class=g onclick=hist(${p.id})>سجل المخزون</button><button class=d onclick=del(${p.id})>حذف</button></div>`).join('')||'<p class=mu>لا توجد سلع</p>'}
function stk(id){const p=D.p.find(x=>x.id==id);modal(`<h3>إدخال كمية: ${e(p.name)}</h3><p>التاريخ: ${today()} (يتسجّل تلقائياً)</p><input id=sq2 type=number step=any placeholder="الكمية (${u(p.m)})"><div class=two><input id=sb2 type=number step=any placeholder="سعر الشراء" value="${p.buy}"><input id=ss2 type=number step=any placeholder="سعر البيع" value="${p.sell}"></div><input id=sv2 list=vl placeholder="اسم المورد" value="${e(p.sup||'')}"><datalist id=vl>${supNames().map(n=>`<option value="${e(n)}">`).join('')}</datalist><input id=sp2 placeholder="هاتف / معلومات المورد" value="${e(p.supi||'')}"><input id=sd2 type=number step=any placeholder="المبلغ المدفوع للمورد (فارغ = دفع كامل)"><button onclick=saveStk(${id})>حفظ</button>`)}
function saveStk(id){const p=D.p.find(x=>x.id==id),q=+$('#sq2').value,b=+$('#sb2').value,s=+$('#ss2').value;if(!(q>0))return alert('أدخل الكمية');if(!(b>=0)||!(s>0))return alert('تحقق من الأسعار');p.qty=Math.round((p.qty+q)*1000)/1000;p.buy=b;p.sell=s;p.sup=$('#sv2').value.trim();p.supi=$('#sp2').value.trim();const tt=b*q,dv=$('#sd2').value;(p.h=p.h||[]).push({date:today(),qty:q,buy:b,sell:s,sup:p.sup,supi:p.supi,total:tt,paid:dv===''?tt:Math.min(+dv,tt)});regV(p.sup,p.supi);D.pur+=b*q;save();$('#m').innerHTML='';drawP()}
function hist(id){const p=D.p.find(x=>x.id==id);modal(`<h3>سجل ${e(p.name)}</h3>${(p.h||[]).slice().reverse().map(h=>`<div style="border-bottom:1px solid #ddd;padding:6px 0">${h.date} · ${h.qty?'دخول '+f(h.qty)+' '+u(p.m):'تعديل أسعار'}<br>شراء ${f(h.buy)} · بيع ${f(h.sell)}${h.sup?'<br>المورد: '+e(h.sup)+(h.supi?' · '+e(h.supi):''):''}</div>`).join('')||'<p>لا يوجد سجل بعد</p>'}`)}
function stkOld(id){const p=D.p.find(x=>x.id==id),q=+prompt('الكمية المشتراة');if(!(q>0))return;const b=+prompt('سعر الشراء',p.buy),v=prompt('اسم المورد',p.sup||'');p.qty=Math.round((p.qty+q)*1000)/1000;if(b>0){p.buy=b;D.pur+=b*q}if(v)p.sup=v.trim();save();drawP()}
function prc(id,k){const p=D.p.find(x=>x.id==id),r=prompt(k=='buy'?'سعر الشراء الجديد':'سعر البيع الجديد',p[k]);if(r===null)return;const v=+r;if(!(v>=0)||(k=='sell'&&!v))return alert('قيمة غير صحيحة');p[k]=v;(p.h=p.h||[]).push({date:today(),qty:0,buy:p.buy,sell:p.sell,sup:p.sup||'',supi:p.supi||''});save();drawP()}
function prcOld(id){const p=D.p.find(x=>x.id==id),b=+prompt('سعر الشراء',p.buy),s=+prompt('سعر البيع',p.sell);if(b>=0)p.buy=b;if(s>0)p.sell=s;save();drawP()}
function del(id){if(confirm('حذف السلعة؟')){D.p=D.p.filter(x=>x.id!=id);save();drawP()}}
let EC=0;
function editC(id){const c=D.c.find(x=>x.id==id);EC=id;[['cn','name'],['ct','phone'],['ca','addr'],['cm','note'],['ce','email'],['crc','rc'],['cnf','nif'],['cns','nis'],['car','art']].forEach(([i,k])=>$('#'+i).value=c[k]||'');$('#cb').textContent='تحديث الزبون';window.scrollTo(0,0)}
function addC(){const n=$('#cn').value.trim();if(!n)return alert('أدخل اسم الزبون');const o={name:n,phone:$('#ct').value,addr:$('#ca').value,note:$('#cm').value,email:$('#ce').value,rc:$('#crc').value,nif:$('#cnf').value,nis:$('#cns').value,art:$('#car').value};if(EC){Object.assign(D.c.find(x=>x.id==EC),o);EC=0}else D.c.push({id:D.id++,...o});save();render()}
function addCold(){const n=$('#cn').value.trim();if(!n)return alert('أدخل اسم الزبون');D.c.push({id:D.id++,name:n,phone:$('#ct').value,addr:$('#ca').value,note:$('#cm').value});save();render()}
function log(id){const c=D.c.find(x=>x.id==id),ops=[...D.s.filter(s=>s.cid==id).map(s=>({date:s.date,t:`${s.no}: مشتريات ${f(s.total)} · مدفوع ${f(s.paid)}`})),...D.y.filter(y=>y.cid==id).map(y=>({date:y.date,t:`تسديد ${f(y.amt)} <button class=g onclick="rec(${y.id})">وصل</button>`}))].sort((a,b)=>b.date.localeCompare(a.date));
modal(`<h3>${e(c.name)}</h3><p>${e(c.phone)} ${e(c.addr||'')} ${e(c.note||'')}</p><p><b>المتبقي: ${f(bal(id))} دج</b></p>${ops.map(o=>`<div>${o.date} · ${o.t}</div>`).join('')||'لا توجد عمليات'}`)}
function recH(y){const c=y.sp||D.c.find(x=>x.id==y.cid)||{},A=U!='فار الأزهر',b=y.before??y.amt;return `<div class='iv ${A?'la':'lf'}'><div class=hd>${shopH()}</div><div class=ti style='margin:12px auto'>REÇU DE PAIEMENT<br><small>${y.sp?'وصل دفع للمورد':'وصل دفع'} · ${y.no||''}</small></div><p>${y.date}</p><div class=bxr style='margin:10px 0'><b>${e(c.name||'')}</b>${c.phone?'<br>'+e(c.phone):''}</div><table><tr><td>الدين قبل الدفع / Dette</td><td>${f(b)} دج</td></tr><tr><td>المبلغ المدفوع / Versé</td><td><b>${f(y.amt)} دج</b></td></tr><tr><td>المتبقي / Reste</td><td><b>${f(b-y.amt)} دج</b></td></tr></table><div class=sg>Cachet et Signature</div></div>`}
let VL=[];
const supNames=()=>{const N=new Set((D.v||[]).map(v=>v.name));D.p.forEach(p=>{if(p.sup)N.add(p.sup);(p.h||[]).forEach(h=>h.sup&&N.add(h.sup))});return[...N]};
const vrows=n=>{const R=[];D.p.forEach(p=>(p.h||[]).forEach(h=>{if(h.sup==n&&h.qty>0){const t=h.total??h.qty*h.buy;R.push({d:h.date,n:'توريد '+p.name+' ('+f(h.qty)+' '+u(p.m)+')',t,p:h.paid??t})}}));(D.vp||[]).filter(y=>y.sup==n).forEach(y=>R.push({d:y.date,n:'تسديد '+(y.no||''),t:0,p:y.amt}));return R};
const vbal=n=>sum(vrows(n),r=>r.t-r.p);
function regV(n,i){if(n&&!(D.v||[]).some(x=>x.name==n))(D.v=D.v||[]).push({name:n,phone:i||''})}
function stmt(rows,title,name,info){rows.sort((a,b)=>(a.d||'').localeCompare(b.d||''));let b=0;const T=sum(rows,r=>r.t),P=sum(rows,r=>r.p);return `<div class='iv lf'><h3 style='text-align:center'>${title}</h3><p><b>${e(name)}</b> ${e(info||'')}<br>${today()}</p><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الرصيد</th></tr>${rows.map(r=>{b+=r.t-r.p;return `<tr><td>${r.d}</td><td>${e(r.n)}</td><td>${f(r.t)}</td><td>${f(r.p)}</td><td>${f(r.t-r.p)}</td><td>${f(b)}</td></tr>`}).join('')}<tr><th colspan=2>الإجمالي</th><th>${f(T)}</th><th>${f(P)}</th><th>${f(T-P)}</th><th>${f(T-P)}</th></tr></table></div>`}
function cst(id){const c=D.c.find(x=>x.id==id);modal(stmt([...D.s.filter(s=>s.cid==id).map(s=>({d:s.date,n:'فاتورة '+s.no,t:s.total,p:s.paid})),...D.y.filter(y=>y.cid==id).map(y=>({d:y.date,n:'تسديد '+(y.no||''),t:0,p:y.amt}))],'كشف حساب الزبون',c.name,c.phone))}
function vst(i){const n=VL[i];modal(stmt(vrows(n),'كشف حساب المورد',n,((D.v||[]).find(x=>x.name==n)||{}).phone))}
function vpay(i){const n=VL[i],b=vbal(n),a=+prompt('مبلغ التسديد للمورد (دج) — المتبقي له: '+f(b));if(!(a>0))return;if(a>b+0.001)return alert('المبلغ أكبر من الدين');const v=(D.v||[]).find(x=>x.name==n)||{name:n},y={id:D.id++,sup:n,amt:a,date:today(),no:nx('PV'),before:b};(D.vp=D.vp||[]).push(y);save();modal(recH({...y,sp:v}));render()}
function vedit(i){const v=(D.v||[]).find(x=>x.name==VL[i])||{name:VL[i]};[['vn','name'],['vt','phone'],['va','addr'],['vr','rc'],['vf','nif'],['vs','nis'],['vb','bank'],['vm','note']].forEach(([k,q])=>$('#'+k).value=v[q]||'');window.scrollTo(0,0)}
function addV(){const n=$('#vn').value.trim();if(!n)return alert('أدخل اسم المورد');const o={name:n,phone:$('#vt').value,addr:$('#va').value,rc:$('#vr').value,nif:$('#vf').value,nis:$('#vs').value,bank:$('#vb').value,note:$('#vm').value},i=(D.v=D.v||[]).findIndex(x=>x.name==n);if(i>=0)Object.assign(D.v[i],o);else D.v.push(o);save();render()}
function supDebts(){VL=supNames();const L=VL.map((n,i)=>({n,i,b:vbal(n)})).filter(x=>x.b>0.001);return `<h3>ديون الموردين (علينا)</h3>${L.map(x=>`<div class=card><b>${e(x.n)}</b><br><b>المتبقي: ${f(x.b)} دج</b><br><button onclick=vpay(${x.i})>تسجيل تسديد</button><button class=g onclick=vst(${x.i})>كشف الحساب</button></div>`).join('')||'<p class=mu>لا توجد ديون للموردين</p>'}`}
function rec(id){modal(recH(D.y.find(x=>x.id==id)))}
function pay(id){const b=bal(id),a=+prompt('مبلغ التسديد (دج) — الدين الحالي: '+f(b));if(!(a>0))return;if(a>b+0.001)return alert('المبلغ أكبر من الدين');const y={id:D.id++,no:nx('R'),cid:id,amt:a,date:today(),before:b};D.y.push(y);save();render();modal(recH(y))}
function payOld(id){const a=+prompt('مبلغ التسديد (دج)');if(!(a>0))return;D.y.push({id:D.id++,cid:id,amt:a,date:today()});save();render()}
render();
</script></body></html>
